name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # 当推送形如 v1.0, v2.0 的 tag 时触发正式发版
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建 Release 并上传文件

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package EXE
        run: .\build-exe.ps1
        shell: powershell

      - name: Zip the App Image
        run: Compress-Archive -Path target\installer\SymlinkGUI -DestinationPath SymlinkGUI-Windows.zip
        shell: powershell

      - name: Publish Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SymlinkGUI-Windows.zip
          generate_release_notes: true

      - name: Publish Pre-release (On Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Auto-generated)
          prerelease: true
          files: SymlinkGUI-Windows.zip
